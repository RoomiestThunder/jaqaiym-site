name: tests

# Проверки на каждом изменении. PHP 8.3 (как на хостинге ps.kz): Ubuntu 24.04 ставит именно его.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: PHP и расширения
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-curl php-mbstring
          php -v

      - name: Все проверки проекта (tools/check.sh: синтаксис, тексты, три набора тестов)
        run: bash tools/check.sh

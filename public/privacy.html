<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{priv.title}}</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="wrap" style="max-width:760px;padding-top:60px;padding-bottom:80px">
  <a class="logo" href="{{base}}/" aria-label="{{logo.aria}}"><img src="/img/brand/wordmark.png" alt="JAQAIYM" height="30" style="height:30px;margin-bottom:40px"></a>
  <h1 style="font-size:clamp(24px,7vw,40px);margin-bottom:24px">{{priv.h1}}</h1>
  <p style="color:var(--muted)">{{priv.p1}}</p>
  <p style="margin-top:18px;color:var(--muted)">{{priv.p2}}</p>
  <p style="margin-top:30px"><a class="btn" href="{{base}}/">{{priv.home}}</a></p>
</div>
</body>
</html>

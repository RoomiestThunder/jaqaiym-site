ндай деректер жиналады<\/h2>\n<p><b>Өзіңіз көрсететін деректер:<\/b> аты; телефон нөмірі; байланыстың қолайлы тәсілі (WhatsApp немесе қоңырау) және қолайлы уақыт; электрондық пошта мекенжайы (қалауыңыз бойынша); бизнес үшін: компания атауы және сіздің рөліңіз; қала; жоба туралы мәліметтер (жиһаз түрі, үй-жай, жоспарлануы, қалаулар, шамамен өлшемдер, қалауыңыз бойынша бюджет пен мерзім, пікірлер); сіз тіркеген файлдар (фото, жоспарлар, сызбалар, визуализациялар, PDF).<\/p>\n<p><b>Автоматты түрде:<\/b> сіз келген бет және жарнамалық ауысулардың белгілері (utm); қауіпсіздік пен спамнан қорғау үшін сервер журналдарындағы сұраныстың техникалық деректері (IP-мекенжай, браузер түрі).<\/p>\n<p>Біз дербес деректердің арнайы санаттарын (денсаулық, наным-сенім және т.б.) сұрамаймыз және жинамаймыз, балалардың деректерін жинамаймыз.<\/p>\n\n<h2>3. Деректер не үшін өңделеді<\/h2>\n<ul>\n<li>сізбен байланысу, өтінімге жауап беру және егжей-тегжейін нақтылау;<\/li>\n<li>өлшеуді ұйымдастыру, есеп және коммерциялық ұсыныс дайындау;<\/li>\n<li>жиһазға тапсырыс беруді шешсеңіз, шарт жасасу және оны орындау;<\/li>\n<li>сайтты спамнан және теріс пайдаланудан қорғау;<\/li>\n<li>келушілердің иесіздендірілген статистикасын жүргізу (аты, телефоны және өтінім мазмұны оған кірмейді).<\/li>\n<\/ul>\n<p>Сіздің жеке келісіміңізсіз тарату жасамаймыз.<\/p>\n\n<h2>4. Өңдеудің негізі<\/h2>\n<p>Өңдеу сіздің келісіміңіз негізінде, ал шарт жасалса, оны орындау үшін де жүргізіледі.<\/p>\n\n<h2>5. Деректер қалай сақталады және қорғалады<\/h2>\n<ul>\n<li>Өтінімдер мен файлдар Оператордың деректер базасында және қоймасында Қазақстан Республикасының аумағында орналасқан серверлерде сақталады <mark>[хостингті таңдағаннан кейін растау]<\/mark>.<\/li>\n<li>Қолжетімділік шектеулі: өтінімдерге оларды өңдейтін қызметкерлер ғана жеке рұқсат бойынша қол жеткізе алады. Деректер қорғалған байланыс (HTTPS) арқылы беріледі.<\/li>\n<li><b>Өтінімдер туралы хабарламалар.<\/b> Жаңа өтінім туралы хабарлама (аты, телефоны, қысқаша мазмұны және карточкаға сілтеме) Оператордың Telegram мессенджеріндегі ішкі жұмыс чатына жіберіледі. Бұл деректердің Қазақстан Республикасынан тыс жерде орналасуы мүмкін Telegram серверлеріне берілуін (трансшекаралық беру) білдіреді. Форманы жіберу арқылы сіз бұған келісім бересіз.<\/li>\n<li><b>Сіздің браузеріңізде.<\/b> Сауалнама жобасы (аты мен телефонсыз) кейін жалғастыра алуыңыз үшін құрылғыңызда 7 күнге дейін сақталады; байланыс деректері тек қойынды жабылғанға дейін сақталады. Сайт бақылау үшін cookie қолданбайды және үшінші тараптың аналитика мен жарнама қызметтерін қоспайды <mark>[кіру есептегіші қосылса, осы тармақты жаңарту]<\/mark>.<\/li>\n<\/ul>\n\n<h2>6. Сақтау мерзімі<\/h2>\n<p><mark>[Келісуге ұсыныс: шартсыз өтінімдер соңғы байланыстан кейін 1 жыл сақталады; шарт жасалса, оның қолданылу мерзіміне және заңнамада белгіленген мерзімге сақталады.]<\/mark> Мерзім біткен соң деректер жойылады немесе иесіздендіріледі.<\/p>\n\n<h2>7. Үшінші тұлғаларға беру<\/h2>\n<p>Біз дербес деректерді сатпаймыз. Оларды тек қажетті көлемде береміз: өтінімді өңдеуге қатысатын қызметкерлер мен мердігерлерге (өлшеу, өндіріс, жеткізу, монтаж); хостинг-провайдерге және мессенджерге (техникалық тұрғыдан); заң талап еткен жағдайда мемлекеттік органдарға.<\/p>\n\n<h2 id=\"consent\">8. Дербес деректерді өңдеуге келісім<\/h2>\n<p>Сайттағы форманы жіберу арқылы мен <mark>[Операторға]<\/mark> 2-бөлімде көрсетілген дербес деректерімді 3-бөлімде көрсетілген мақсаттарда, 6-бөлімде көрсетілген мерзімге жинауға, өңдеуге, сақтауға, пайдалануға және беруге (оның ішінде ішкі хабарламалар үшін Telegram мессенджеріне трансшекаралық беруге) келісім беремін. Келісім ерікті түрде беріледі. Мен оны кез келген уақытта 9-бөлімде көрсетілген тәсілмен қайтарып ала аламын.<\/p>\n\n<h2>9. Сіздің құқықтарыңыз<\/h2>\n<ul>\n<li>сіз туралы қандай деректер өңделетінін білу;<\/li>\n<li>деректер толық емес, ескірген немесе заңсыз өңделсе, оларды нақтылауды, бұғаттауды немесе жоюды талап ету;<\/li>\n<li>к
